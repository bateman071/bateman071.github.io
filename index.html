<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wastly AI</title>
  <meta name="description" content="Wastly AI — industrial circular marketplace. Waste isn’t waste when someone needs it." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f0e8; --surface: #fffcf6; --surface-2: #f7f3ea; --fg: #14201a;
      --muted: #5e6b64; --subtle: #8a938c; --primary: #147a4b; --primary-fg: #f3fff6;
      --primary-hover: #0f643d; --ink: #13211a; --ink-fg: #d7e3db; --ink-muted: #8aa193;
      --border: #d9d2c4; --warn: #9a6700; --danger: #b42318; --score-bg: #e7f2c8; --score: #3f6b1d;
      --radius: 12px; --shadow: 0 1px 0 rgba(20,32,26,.04), 0 8px 24px -16px rgba(20,32,26,.18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.5; }
    h1,h2,h3 { letter-spacing: -.03em; font-weight: 600; line-height: 1.15; margin: 0; }
    p { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button, [role="button"] { cursor: pointer; font-family: inherit; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); } .primary { color: var(--primary); }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 16px;
      border-radius: 8px; border: 1px solid transparent; font-size: 14px; font-weight: 500; background: var(--primary);
      color: var(--primary-fg); }
    .btn:hover { background: var(--primary-hover); }
    .btn.sec { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn.sec:hover { background: var(--surface-2); }
    .btn.ghost { background: transparent; color: var(--fg); }
    .btn.ghost:hover { background: var(--surface-2); }
    .btn.out { background: transparent; color: var(--fg); border-color: #c4bba8; }
    .btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
    .btn:disabled { opacity: .5; pointer-events: none; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .pad { padding: 16px; }
    .grid { display: grid; gap: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .between { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; }
    input, select, textarea { width: 100%; height: 40px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); padding: 0 12px; font: inherit; color: var(--fg); }
    textarea { height: auto; padding: 8px 12px; min-height: 80px; }
    label span { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .badge.ok { background: var(--score-bg); color: var(--score); border-color: transparent; }
    .badge.warn { background: #f8efd2; color: var(--warn); border-color: transparent; }
    .badge.ink { background: #1b2b22; color: var(--ink-fg); border-color: transparent; }
    .wordmark { display: flex; align-items: center; gap: 8px; }
    .wordmark small { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .shell { min-height: 100dvh; }
    .side { position: fixed; inset: 0 auto 0 0; width: 240px; background: var(--ink); color: var(--ink-fg); display: none; flex-direction: column; }
    .side a { display: flex; align-items: center; height: 40px; padding: 0 12px; margin: 2px 8px; border-radius: 8px; color: var(--ink-muted); font-size: 14px; }
    .side a:hover, .side a.on { background: rgba(255,255,255,.1); color: #fff; }
    .top { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 90%, white); backdrop-filter: blur(8px); }
    .main { padding: 20px 16px 80px; max-width: 1120px; margin: 0 auto; }
    @media (min-width: 960px) {
      .side { display: flex; }
      .shell { padding-left: 240px; }
    }
    .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
    .msg { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--ink-fg); padding: 10px 14px;
      border-radius: 8px; font-size: 13px; z-index: 50; }
    .hidden { display: none !important; }
    .map { height: 160px; border-radius: 8px; background:
      linear-gradient(135deg, #d7e3db, #efece3 40%, #e7f2c8);
      position: relative; overflow: hidden; border: 1px solid var(--border); }
    .map .dot { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
    .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    pre { white-space: pre-wrap; font-family: "IBM Plex Mono", monospace; font-size: 12px; background: var(--surface-2); padding: 12px; border-radius: 8px; overflow: auto; max-height: 320px; }
    .qr { width: 120px; height: 120px; background:
      repeating-conic-gradient(#14201a 0 25%, #fff 0 50%) 0 0 / 12px 12px;
      border-radius: 8px; border: 8px solid #fff; box-shadow: 0 0 0 1px var(--border); }
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="views-deal.js"></script>
<script src="ui.js"></script>
</body>
</html>
